# ─────────────────────────────────────────────────────────────────────────────
# FILE INI: commit ke .github/workflows/sync-secrets.yml di GitHub repo kamu
# ─────────────────────────────────────────────────────────────────────────────
# GitHub Secrets yang harus ada di repo ini:
#
#   CF_ACCOUNT_ID        — Cloudflare Account ID
#   CF_API_TOKEN         — Cloudflare API Token  (Workers Scripts:Edit + KV Storage:Edit)
#   CF_WORKER_NAME       — Nama script Worker   (misal: zeodda-shopee-proxy)
#   CF_KV_NAMESPACE_ID   — KV Namespace ID binding "TOKENS"
#
#   SHOPEE_PARTNER_ID
#   SHOPEE_PARTNER_KEY
#   ADMIN_PASSWORD
#   LARK_APP_ID          ← baru
#   LARK_APP_SECRET      ← baru
#
#   SHOPEE_REFRESH_TOKEN_867817945
#   SHOPEE_REFRESH_TOKEN_963990340
#   SHOPEE_REFRESH_TOKEN_899095041
#   SHOPEE_REFRESH_TOKEN_967593785
#   SHOPEE_REFRESH_TOKEN_981846983
#   SHOPEE_REFRESH_TOKEN_963980234
#   SHOPEE_REFRESH_TOKEN_1101111522
#   SHOPEE_REFRESH_TOKEN_1102913663
# ─────────────────────────────────────────────────────────────────────────────

name: Sync Secrets → Cloudflare

on:
  workflow_dispatch:     # jalankan manual kapan saja dari tab GitHub Actions
  push:
    branches: [main]
    paths: ['.github/workflows/sync-secrets.yml']

jobs:
  sync-worker-secrets:
    name: Sync Worker Secrets (PARTNER_KEY, LARK, ADMIN)
    runs-on: ubuntu-latest
    steps:
      - name: Push secrets ke Cloudflare Worker
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
        run: |
          # Helper: set satu Worker Secret via Cloudflare API
          set_secret() {
            local NAME="$1" VALUE="$2"
            RESULT=$(curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_NAME}/secrets" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${NAME}\",\"text\":\"${VALUE}\",\"type\":\"secret_text\"}")
            if echo "$RESULT" | grep -q '"success":true'; then
              echo "  ✓ ${NAME}"
            else
              echo "  ✗ ${NAME}: $RESULT"
              exit 1
            fi
          }

          echo "=== Sync Worker Secrets ==="
          set_secret "PARTNER_ID_SHOPEE"  "${{ secrets.SHOPEE_PARTNER_ID }}"
          set_secret "PARTNER_KEY_SHOPEE" "${{ secrets.SHOPEE_PARTNER_KEY }}"
          set_secret "LARK_APP_ID"        "${{ secrets.LARK_APP_ID }}"
          set_secret "LARK_APP_SECRET"    "${{ secrets.LARK_APP_SECRET }}"
          set_secret "ADMIN_PASSWORD"     "${{ secrets.ADMIN_PASSWORD }}"
          echo "✅ Semua Worker Secrets berhasil di-sync"

  sync-shopee-tokens:
    name: Refresh & Sync Shopee Access Tokens → KV
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Shopee tokens dan simpan ke KV
        env:
          CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          PARTNER_ID:         ${{ secrets.SHOPEE_PARTNER_ID }}
          PARTNER_KEY:        ${{ secrets.SHOPEE_PARTNER_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, hmac, hashlib, time, json, urllib.request, sys

          PARTNER_ID  = os.environ["PARTNER_ID"]
          PARTNER_KEY = os.environ["PARTNER_KEY"].encode()
          CF_ACCOUNT  = os.environ["CF_ACCOUNT_ID"]
          CF_TOKEN    = os.environ["CF_API_TOKEN"]
          CF_KV_NS    = os.environ["CF_KV_NAMESPACE_ID"]
          API_HOST    = "https://partner.shopeemobile.com"

          # Toko: {shop_id: env_var_name}
          SHOPS = {
              867817945:  "SHOPEE_REFRESH_TOKEN_867817945",
              963990340:  "SHOPEE_REFRESH_TOKEN_963990340",
              899095041:  "SHOPEE_REFRESH_TOKEN_899095041",
              967593785:  "SHOPEE_REFRESH_TOKEN_967593785",
              981846983:  "SHOPEE_REFRESH_TOKEN_981846983",
              963980234:  "SHOPEE_REFRESH_TOKEN_963980234",
              1101111522: "SHOPEE_REFRESH_TOKEN_1101111522",
              1102913663: "SHOPEE_REFRESH_TOKEN_1102913663",
          }

          def sign(path):
              ts = int(time.time())
              base = f"{PARTNER_ID}{path}{ts}".encode()
              sig = hmac.new(PARTNER_KEY, base, hashlib.sha256).hexdigest()
              return ts, sig

          def api_post(path, payload):
              ts, sig = sign(path)
              url = f"{API_HOST}{path}?partner_id={PARTNER_ID}&timestamp={ts}&sign={sig}"
              data = json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data,
                    headers={"Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          def kv_put(key, value):
              url = f"https://api.cloudflare.com/client/v4/accounts/{CF_ACCOUNT}/storage/kv/namespaces/{CF_KV_NS}/values/{key}"
              req = urllib.request.Request(url, data=value.encode(),
                    headers={"Authorization": f"Bearer {CF_TOKEN}", "Content-Type": "text/plain"},
                    method="PUT")
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read())

          all_ok = True
          for shop_id, env_var in SHOPS.items():
              rt = os.environ.get(env_var, "").strip()
              if not rt:
                  print(f"  ⚠ {shop_id}: refresh token kosong, skip")
                  continue
              try:
                  resp = api_post("/api/v2/auth/access_token/get", {
                      "refresh_token": rt,
                      "partner_id": int(PARTNER_ID),
                      "shop_id": shop_id,
                  })
                  at = resp.get("access_token") or (resp.get("response") or {}).get("access_token")
                  if not at:
                      print(f"  ✗ {shop_id}: gagal dapat access_token — {resp}")
                      all_ok = False
                      continue
                  kv_key = f"token%3A{shop_id}"   # URL-encode ":"
                  kv_put(kv_key, at)
                  print(f"  ✓ {shop_id}: access_token tersimpan ke KV")
              except Exception as e:
                  print(f"  ✗ {shop_id}: {e}")
                  all_ok = False

          if not all_ok:
              sys.exit(1)
          print("✅ Semua token berhasil di-refresh dan di-sync ke KV")
          PYEOF
        env:
          SHOPEE_REFRESH_TOKEN_867817945:  ${{ secrets.SHOPEE_REFRESH_TOKEN_867817945 }}
          SHOPEE_REFRESH_TOKEN_963990340:  ${{ secrets.SHOPEE_REFRESH_TOKEN_963990340 }}
          SHOPEE_REFRESH_TOKEN_899095041:  ${{ secrets.SHOPEE_REFRESH_TOKEN_899095041 }}
          SHOPEE_REFRESH_TOKEN_967593785:  ${{ secrets.SHOPEE_REFRESH_TOKEN_967593785 }}
          SHOPEE_REFRESH_TOKEN_981846983:  ${{ secrets.SHOPEE_REFRESH_TOKEN_981846983 }}
          SHOPEE_REFRESH_TOKEN_963980234:  ${{ secrets.SHOPEE_REFRESH_TOKEN_963980234 }}
          SHOPEE_REFRESH_TOKEN_1101111522: ${{ secrets.SHOPEE_REFRESH_TOKEN_1101111522 }}
          SHOPEE_REFRESH_TOKEN_1102913663: ${{ secrets.SHOPEE_REFRESH_TOKEN_1102913663 }}
