name: Naikkan Produk Otomatis
on:
  repository_dispatch:
    types: [pemicu_cron_eksternal]  # Mendengarkan tembakan dari cron-job.org
  workflow_dispatch:                # Tombol manual di web GitHub tetap aktif

jobs:
  run-boost:
    runs-on: ubuntu-latest
    env:
      SHOPEE_PARTNER_ID:     ${{ secrets.SHOPEE_PARTNER_ID }}
      SHOPEE_PARTNER_KEY:    ${{ secrets.SHOPEE_PARTNER_KEY }}
      SHOPEE_SHOP_IDS:       ${{ secrets.SHOPEE_SHOP_IDS }}
      SHOPEE_ACCESS_TOKEN:   ${{ secrets.SHOPEE_ACCESS_TOKEN }}
      SHOPEE_REFRESH_TOKEN:  ${{ secrets.SHOPEE_REFRESH_TOKEN }}
      
      # Pemetaan 8 Kunci Toko Cabang Secara Lengkap
      SHOPEE_REFRESH_TOKEN_1101111522: ${{ secrets.SHOPEE_REFRESH_TOKEN_1101111522 }}
      SHOPEE_REFRESH_TOKEN_1102913663: ${{ secrets.SHOPEE_REFRESH_TOKEN_1102913663 }}
      SHOPEE_REFRESH_TOKEN_867817945:  ${{ secrets.SHOPEE_REFRESH_TOKEN_867817945 }}
      SHOPEE_REFRESH_TOKEN_899095041:  ${{ secrets.SHOPEE_REFRESH_TOKEN_899095041 }}
      SHOPEE_REFRESH_TOKEN_963980234:  ${{ secrets.SHOPEE_REFRESH_TOKEN_963980234 }}
      SHOPEE_REFRESH_TOKEN_963990340:  ${{ secrets.SHOPEE_REFRESH_TOKEN_963990340 }}
      SHOPEE_REFRESH_TOKEN_967593785:  ${{ secrets.SHOPEE_REFRESH_TOKEN_967593785 }}
      SHOPEE_REFRESH_TOKEN_981846983:  ${{ secrets.SHOPEE_REFRESH_TOKEN_981846983 }}
      
      LARK_APP_ID:           ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET:       ${{ secrets.LARK_APP_SECRET }}
      GH_PAT:                ${{ secrets.GH_PAT }}
      GH_REPO:               ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests PyNaCl

      # STEP UTAMA: Injeksi Stateful Interceptor Berjalur Absolut
      - name: Inject Token Interceptor
        run: |
          cat << 'EOF' > interceptor.py
          import requests
          import json
          import os
          import urllib.parse as urlparse

          # Menggunakan jalur absolut /tmp/ agar aman dari os.chdir() script utama
          cache_file = '/tmp/cf_tokens_cache.json'
          CURRENT_SHOP_ID = None

          def save_token(shop_id, token):
              if not shop_id or not token: return
              shop_id = str(shop_id).strip()
              token = str(token).strip()
              try:
                  with open(cache_file, 'r') as f: data = json.load(f)
              except: data = {}
              data[shop_id] = token
              with open(cache_file, 'w') as f: json.dump(data, f)

          # Pembajakan inti lalu lintas keluar-masuk library requests
          orig_request = requests.Session.request
          def patched_request(self, method, url, *args, **kwargs):
              global CURRENT_SHOP_ID
              try:
                  req_shop_id = None
                  req_access_token = None

                  # 1. Ambil data jika dilempar lewat URL Query String
                  parsed = urlparse.urlparse(url)
                  params = urlparse.parse_qs(parsed.query)
                  if params.get('shop_id'): req_shop_id = params.get('shop_id')[0]
                  if params.get('access_token'): req_access_token = params.get('access_token')[0]

                  # 2. Ambil data jika dilempar lewat keyword arguments params (requests.post(url, params=...))
                  if 'params' in kwargs and isinstance(kwargs['params'], dict):
                      if kwargs['params'].get('shop_id'): req_shop_id = kwargs['params'].get('shop_id')
                      if kwargs['params'].get('access_token'): req_access_token = kwargs['params'].get('access_token')

                  # 3. Ambil data jika dilempar lewat JSON Body payload
                  if 'json' in kwargs and isinstance(kwargs['json'], dict):
                      if kwargs['json'].get('shop_id'): req_shop_id = kwargs['json'].get('shop_id')
                      if kwargs['json'].get('access_token'): req_access_token = kwargs['json'].get('access_token')

                  # Ikat shop_id ke memori status global jika terdeteksi di request
                  if req_shop_id:
                      CURRENT_SHOP_ID = req_shop_id

                  # Jika request adalah transaksi normal (akses token & shop id lengkap), langsung amankan
                  if req_shop_id and req_access_token:
                      save_token(req_shop_id, req_access_token)
              except: pass

              # Eksekusi request asli ke server Shopee
              res = orig_request(self, method, url, *args, **kwargs)

              # 4. Amankan token baru dari response body hasil refresh token secara stateful
              try:
                  val = res.json()
                  if isinstance(val, dict):
                      target = val.get('response') if isinstance(val.get('response'), dict) else val
                      if 'access_token' in target:
                          sid = target.get('shop_id') or CURRENT_SHOP_ID
                          tok = target.get('access_token')
                          if sid and tok:
                              save_token(sid, tok)
              except: pass

              return res

          requests.Session.request = patched_request
          EOF
          
          if [ -f "scripts/zeodda_helpers.py" ]; then
            cat interceptor.py "scripts/zeodda_helpers.py" > temp.py && mv temp.py "scripts/zeodda_helpers.py"
            echo "✅ Live Interceptor Stateful Deep-Scan Aktif."
          else
            mkdir -p scripts && cp interceptor.py scripts/zeodda_helpers.py
            echo "⚠️ zeodda_helpers.py diinisialisasi baru."
          fi

      - name: Run Boost
        run: python scripts/Naikkan_Produk.py

      # STEP SINKRONISASI: Membaca berkas absolut dari /tmp/ lalu push data ke Cloudflare KV
      - name: Push token ke Cloudflare KV
        if: always()
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python -c "
          import os, requests, json, sys

          cf_id = os.getenv('CF_ACCOUNT_ID')
          cf_ns = os.getenv('CF_KV_NAMESPACE')
          cf_token = os.getenv('CF_API_TOKEN')

          if not all([cf_id, cf_ns, cf_token]):
              print('❌ Error: Kredensial Cloudflare KV di GitHub Secrets belum lengkap!')
              sys.exit(1)

          cache_file = '/tmp/cf_tokens_cache.json'
          if not os.path.exists(cache_file):
              print('❌ Gagal: Token gagal disadap. Hubungi pengembang untuk pengecekan library requests.')
              sys.exit(1)

          with open(cache_file, 'r') as f:
              tokens = json.load(f)

          print(f'=== SINKRONISASI {len(tokens)} TOKO KE CLOUDFLARE KV ===')
          for shop_id, token in tokens.items():
              url = f'https://api.cloudflare.com/client/v4/accounts/{cf_id}/storage/kv/namespaces/{cf_ns}/values/token:{shop_id}'
              headers = {'Authorization': f'Bearer {cf_token}', 'Content-Type': 'text/plain'}
              res = requests.put(url, headers=headers, data=str(token))
              if res.status_code == 200:
                  print(f'✅ Toko {shop_id}: Berhasil amankan token aktif ke Cloudflare KV.')
              else:
                  print(f'❌ Toko {shop_id}: Gagal kirim ke KV ({res.status_code}) -> {res.text}')
          print('=== SINKRONISASI SELESAI ===')
          "

      - name: Notify success
        if: success()
        run: echo "✅ Boost selesai pada $(date)"

      - name: Notify failure
        if: failure()
        run: echo "❌ Boost gagal pada $(date)"
