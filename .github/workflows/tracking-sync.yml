name: Tracking Sync (Shopee + TikTok)

on:
  workflow_dispatch: {}
  schedule:
    # Sekali sehari sekitar jam 09:30 WIB (02:30 UTC). Menit sengaja BUKAN :00
    # karena GitHub sendiri bilang jadwal tepat di awal jam paling rawan delay/dropped saat load tinggi.
    - cron: '30 2 * * *'

concurrency:
  group: tracking-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 15 Sep 2026: SHOPEE_PARTNER_ID/KEY + 8 SHOPEE_REFRESH_TOKEN_<shopId> DIHAPUS -- token
      # statis itu selalu basi (refresh_token Shopee berputar, worker Cloudflare merefresh
      # tiap 3,5 jam & menimpa salinan yg di sini tidak pernah ikut ter-update). Panggilan
      # Shopee sekarang lewat WORKER_URL (action "gh_shopee_proxy"), token selalu segar dari
      # Worker sendiri. Hapus 10 secret lama itu dari repo Settings -> Secrets kalau mau
      # beres2 (tidak wajib, sudah tidak dibaca sama sekali).
      #
      # Secret DI GITHUB namanya TRACKING_SYNC_SECRET, bukan GITHUB_SYNC_SECRET -- GitHub
      # melarang nama secret diawali "GITHUB_" (prefix dicadangkan). Nilainya harus SAMA PERSIS
      # dgn secret `GITHUB_SYNC_SECRET` yg di-set di Cloudflare Worker (`wrangler secret put`);
      # env var yg dibaca script (GITHUB_SYNC_SECRET, kiri "=") sengaja TETAP disamakan dgn nama
      # di Worker, cuma sumbernya (kanan) yg beda nama krn batasan GitHub itu.
      - name: Run tracking sync
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          WORKER_URL: https://zeodda-shopee-proxy.hjb-database.workers.dev
          GITHUB_SYNC_SECRET: ${{ secrets.TRACKING_SYNC_SECRET }}
        run: node scripts/tracking-sync.mjs
