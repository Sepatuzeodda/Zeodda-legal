# .github/workflows/zeodda_automation.yml
name: Zeodda Automation

on:
  schedule:
    - cron: '0 20 * * *' # Jam 03:00 WIB
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    # Daftarkan env di level JOB agar bisa dibaca oleh semua script python
    env:
      SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
      SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
      SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
      SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
      SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }} # WAJIB BARIS INI
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Daily Overview
        run: python scripts/zeodda_daily_overview.py
