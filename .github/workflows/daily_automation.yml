name: Zeodda Daily Automation

on:
  schedule:
    - cron: '0 17 * * *'  # Jam 00:00 WIB = 17:00 UTC
  workflow_dispatch:  # Bisa dijalankan manual juga

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Zeodda Automation
        env:
          SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_SHOP_ID: ${{ secrets.SHOPEE_SHOP_ID }}
          SHOPEE_ACCESS_TOKEN: ${{ secrets.SHOPEE_ACCESS_TOKEN }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_USER_TOKEN: ${{ secrets.LARK_USER_TOKEN }}
        run: python scripts/zeodda_automation.py

      - name: Notify success
        if: success()
        run: echo "✅ Automation berhasil dijalankan pada $(date)"

      - name: Notify failure
        if: failure()
        run: echo "❌ Automation gagal pada $(date)"
