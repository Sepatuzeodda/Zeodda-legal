name: Daily Automation
on:
  schedule:
    - cron: '0 20 * * *'  # Jam 03:00 WIB
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    env:
      SHOPEE_PARTNER_ID:    ${{ secrets.SHOPEE_PARTNER_ID }}
      SHOPEE_PARTNER_KEY:   ${{ secrets.SHOPEE_PARTNER_KEY }}
      SHOPEE_SHOP_IDS:      ${{ secrets.SHOPEE_SHOP_IDS }}
      SHOPEE_ACCESS_TOKEN:  ${{ secrets.SHOPEE_ACCESS_TOKEN }}
      SHOPEE_REFRESH_TOKEN: ${{ secrets.SHOPEE_REFRESH_TOKEN }}
      LARK_APP_ID:          ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET:      ${{ secrets.LARK_APP_SECRET }}
      GH_PAT:               ${{ secrets.GH_PAT }}
      GH_REPO:              ${{ github.repository }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests PyNaCl

      - name: Run Daily Overview
        run: python scripts/zeodda_daily_overview.py

      - name: Notify success
        if: success()
        run: echo "✅ Automation selesai pada $(date)"

      - name: Notify failure
        if: failure()
        run: echo "❌ Automation gagal pada $(date)"
